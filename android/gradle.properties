# JVM Argümanları (Bellek ve Performans Ayarları)
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX Kullanımı
android.useAndroidX=true

# Java Ana Dizini (Uyarıları Düzeltmek İçin Eklenmeli)
# Java 25 sürümünüzün kurulum yolunu belirtin (örneğin, C:/Program Files/Java/jdk-25)
# Eğer sorun çıkarsa, JDK 17'ye geçin ve yolu güncelleyin.
org.gradle.java.home=C:/Program Files/Java/jdk-25.0.2
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr