name: manisa_ulasim
description: Manisa Kentsel Toplu Taşıma Destek Sistemi - Erişilebilirlik odaklı yolcu uygulaması

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # AI / ML
  tflite_flutter: ^0.10.4
  json_annotation: ^4.8.1

  # Güvenli API Key yönetimi (.env dosyası)
  flutter_dotenv: ^5.2.1

  # NFC & QR
  nfc_manager: 4.1.1
  nfc_manager_ndef: ^1.0.1
  mobile_scanner: ^5.0.0

  # State Management
  provider: ^6.1.1

  # Konum Servisleri
  geolocator: ^10.1.0
  permission_handler: ^11.1.0

  # Harita (OpenStreetMap - Ücretsiz)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Sesli Komut & Geri Bildirim
  speech_to_text: ^7.0.0
  flutter_tts: ^3.8.5

  # Yerel Veritabanı (GTFS verilerini saklamak için)
  sqflite: ^2.3.0
  path: ^1.8.3

  # HTTP İstekleri (API için)
  http: ^1.1.0

  # CSV Parsing (GTFS dosyaları için)
  csv: ^5.1.1

  # Mesafe Hesaplama
  haversine_distance: ^1.0.4

  # UI Yardımcıları
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0

  # URL Launcher (Yol tarifi için)
  url_launcher: ^6.2.1

  # Erişilebilirlik - Lokalizasyon
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  shared_preferences: ^2.3.3

  # Bildirimler (Araç takibi için)
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/convertedicon.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/convertedicon.jpg"

flutter:
  generate: true
  uses-material-design: true

  assets:
    # Manisa GTFS verisi (mevcut — dokunma)
    - assets/data/
    # Kıbrıs GTFS verisi (yeni)
    - assets/gtfs/cyprus/
    # Görseller ve diğer
    - assets/BUS.png
    - assets/convertedicon.jpg
    - .env
